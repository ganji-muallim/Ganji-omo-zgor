<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GANJI OMO’ZGOR — Ҳар дарс -қадаме ба сӯи дониш</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #0f4c81;
      --primary-dark: #093256;
      --accent: #e09f3e;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #15803d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff;
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(9, 50, 86, 0.18);
    }

    .header-inner {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      object-fit: cover;
      background: #fff;
      border: 2px solid rgba(255, 255, 255, 0.35);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .brand-slogan {
      font-size: 0.85rem;
      color: #fde68a;
    }

    .status-pill {
      font-size: 0.78rem;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    main {
      max-width: 1040px;
      margin: 24px auto 60px;
      padding: 0 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1.45fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
    }

    .card h2 {
      font-size: 1.08rem;
      color: var(--primary-dark);
      margin-bottom: 14px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.86rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--text);
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.94rem;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 11px 16px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .filters select, .filters input {
      flex: 1;
      min-width: 150px;
    }

    .material-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      background: #fcfdff;
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .badge {
      font-size: 0.76rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      background: #e0f2fe;
      color: var(--primary-dark);
    }

    .price {
      font-weight: 800;
      color: var(--success);
      font-size: 0.92rem;
    }

    .item-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .item-desc {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .item-meta {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .msg {
      margin-top: 10px;
      font-size: 0.86rem;
      font-weight: 600;
    }

    .msg.ok {
      color: var(--success);
    }

    .msg.err {
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <img src="logo.png" alt="GANJI OMO’ZGOR" onerror="this.style.display='none'" />
        <div>
          <div class="brand-title">GANJI OMO’ZGOR</div>
          <div class="brand-slogan">Ҳар дарс -қадаме ба сӯи дониш</div>
        </div>
      </div>
      <div class="status-pill" id="dbStatus">Пайвастшавӣ ба Firebase...</div>
    </div>
  </header>

  <main>
    <div class="grid">
      <section class="card">
        <h2>Илова кардани маводи нав</h2>
        <form id="materialForm">
          <div class="form-group">
            <label for="title">Унвони мавод / дарс</label>
            <input type="text" id="title" placeholder="Масалан: Нақша-конспект — Меъёри сарфию наҳвӣ" required />
          </div>

          <div class="form-group">
            <label for="grade">Синф</label>
            <select id="grade" required>
              <option value="Синфи 8">Синфи 8</option>
              <option value="Синфи 9">Синфи 9</option>
              <option value="Синфи 10">Синфи 10</option>
              <option value="Синфи 11">Синфи 11</option>
            </select>
          </div>

          <div class="form-group">
            <label for="subject">Фан / Бахш</label>
            <select id="subject" required>
              <option value="Забон ва адабиёти тоҷик">Забон ва адабиёти тоҷик</option>
              <option value="Тарбия">Тарбия</option>
              <option value="Дарси кушод">Дарси кушод</option>
              <option value="Презентатсия">Презентатсия</option>
            </select>
          </div>

          <div class="form-group">
            <label for="price">Нарх (масалан: Ройгон ё 15 сомонӣ)</label>
            <input type="text" id="price" placeholder="Ройгон" value="Ройгон" required />
          </div>

          <div class="form-group">
            <label for="description">Тавсифи мухтасар</label>
            <textarea id="description" placeholder="Маълумот дар бораи нақша-конспект, методҳо (БАО, Кластер) ва мавод..."></textarea>
          </div>

          <button type="submit" class="btn" id="submitBtn">Сабт кардан дар база</button>
          <div class="msg" id="formMsg"></div>
        </form>
      </section>

      <section class="card">
        <h2>Маводҳои омӯзгорон</h2>
        <div class="filters">
          <select id="filterGrade">
            <option value="ALL">Ҳамаи синфҳо (8–11)</option>
            <option value="Синфи 8">Синфи 8</option>
            <option value="Синфи 9">Синфи 9</option>
            <option value="Синфи 10">Синфи 10</option>
            <option value="Синфи 11">Синфи 11</option>
          </select>
          <input type="text" id="searchInput" placeholder="Ҷустуҷӯ аз рӯи унвон ё фан..." />
        </div>

        <div class="material-list" id="materialList">
          <p class="item-desc">Маводҳо бор шуда истодаанд...</p>
        </div>
      </section>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD2ofVuJhYz1dibz9a_Ash5_1l0uz65E3c",
      authDomain: "ganji-muallim.firebaseapp.com",
      projectId: "ganji-muallim",
      storageBucket: "ganji-muallim.firebasestorage.app",
      messagingSenderId: "526055481500",
      appId: "1:526055481500:web:b4e4372387452810ed0d59",
      measurementId: "G-9ZD7F3PDDB"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const materialsRef = collection(db, "materials");

    const dbStatus = document.getElementById("dbStatus");
    const form = document.getElementById("materialForm");
    const submitBtn = document.getElementById("submitBtn");
    const formMsg = document.getElementById("formMsg");
    const listEl = document.getElementById("materialList");
    const filterGrade = document.getElementById("filterGrade");
    const searchInput = document.getElementById("searchInput");

    let allMaterials = [];

    function renderMaterials() {
      const gradeVal = filterGrade.value;
      const searchVal = searchInput.value.trim().toLowerCase();

      const filtered = allMaterials.filter((item) => {
        const matchesGrade = gradeVal === "ALL" || item.grade === gradeVal;
        const text = `${item.title || ""} ${item.subject || ""} ${item.description || ""}`.toLowerCase();
        const matchesSearch = !searchVal || text.includes(searchVal);
        return matchesGrade && matchesSearch;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `<p class="item-desc">Ҳоло маводе ёфт нашуд. Дар тарафи чап маводи аввалинро илова кунед.</p>`;
        return;
      }

      listEl.innerHTML = filtered
        .map(
          (item) => `
          <article class="item">
            <div class="item-top">
              <span class="badge">${escapeHtml(item.grade || "")} • ${escapeHtml(item.subject || "")}</span>
              <span class="price">${escapeHtml(item.price || "Ройгон")}</span>
            </div>
            <div class="item-title">${escapeHtml(item.title || "")}</div>
            ${item.description ? `<div class="item-desc">${escapeHtml(item.description)}</div>` : ""}
            <div class="item-meta">Базаи GANJI OMO’ZGOR</div>
          </article>
        `
        )
        .join("");
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    const q = query(materialsRef, orderBy("createdAt", "desc"));
    onSnapshot(
      q,
      (snapshot) => {
        dbStatus.textContent = "Firestore пайваст аст ✓";
        allMaterials = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
        renderMaterials();
      },
      (error) => {
        console.error(error);
        dbStatus.textContent = "Хатои пайвастшавӣ";
        listEl.innerHTML = `<p class="msg err">Барои хондани мавод қоидаҳои Firestore-ро санҷед ё саҳифаро нав кунед.</p>`;
      }
    );

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      formMsg.textContent = "";
      formMsg.className = "msg";

      const title = document.getElementById("title").value.trim();
      const grade = document.getElementById("grade").value;
      const subject = document.getElementById("subject").value;
      const price = document.getElementById("price").value.trim() || "Ройгон";
      const description = document.getElementById("description").value.trim();

      if (!title) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Сабт шуда истодааст...";

      try {
        await addDoc(materialsRef, {
          title,
          grade,
          subject,
          price,
          description,
          createdAt: serverTimestamp()
        });
        form.reset();
        document.getElementById("price").value = "Ройгон";
        formMsg.textContent = "Мавод бомуваффақият дар Firestore сабт шуд!";
        formMsg.classList.add("ok");
      } catch (err) {
        console.error(err);
        formMsg.textContent = "Ҳангоми сабт хато рух дод. Қоидаҳои Firestore-ро тафтиш кунед.";
        formMsg.classList.add("err");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Сабт кардан дар база";
      }
    });

    filterGrade.addEventListener("change", renderMaterials);
    searchInput.addEventListener("input", renderMaterials);
  </script>
</body>
</html>
